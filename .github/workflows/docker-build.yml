# Builds the Job Ops image on every PR and on main, then boots it and waits for
# /health. The image is the upstream release pinned in the Dockerfile, so what
# this catches is a tag that no longer exists or an image that no longer starts
# without configuration — the app must come up with no variables set.
name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build job-ops
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: job-ops:ci
          cache-from: type=gha,scope=job-ops
          cache-to: type=gha,mode=max,scope=job-ops

      - name: Boots and answers /health with no configuration
        run: |
          docker run -d --name jo -p 3001:3001 job-ops:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'

      - name: Logs on failure
        if: failure()
        run: docker logs jo || true

  # A Renovate bump starts the new image on the volume the previous one left
  # behind, and the upstream entrypoint runs its drizzle migrations against that
  # jobs.db. Booting an empty volume says nothing about it, so start the image
  # main pins with the env .railway/railway.ts sets, store a job through the
  # API, then start this branch's image on the same volume and read it back.
  # BASIC_AUTH_USER and BASIC_AUTH_PASSWORD seed the first admin on a fresh
  # database; without a user every /api route answers "Initial setup is required".
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build job-ops image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: job-ops:ci
          cache-from: type=gha,scope=job-ops

      - name: Resolve the image main pins
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin main
          base="$(git show FETCH_HEAD:Dockerfile | sed -n 's/^FROM //p')"
          test -n "$base"
          echo "upgrading from $base"
          echo "BASE_IMAGE=$base" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/jo.env" <<'EOF'
          PORT=3001
          DATA_DIR=/app/data
          CODEX_HOME=/app/data/codex-home
          XDG_CACHE_HOME=/app/data/cache
          JOBOPS_PUBLIC_BASE_URL=http://localhost:3001
          BASIC_AUTH_USER=ci
          BASIC_AUTH_PASSWORD=ci-password-123
          EOF

      - name: The image main pins stores a job
        run: |
          set -eu
          docker volume create jo-data
          docker run -d --name jo-base -p 3001:3001 -v jo-data:/app/data \
            --env-file "$RUNNER_TEMP/jo.env" "$BASE_IMAGE"
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'

          token="$(curl -fsS -X POST http://localhost:3001/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"ci","password":"ci-password-123"}' | jq -er .data.token)"
          curl -fsS -X POST http://localhost:3001/api/manual-jobs/import \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d '{"skipTailoring":true,"job":{"title":"CI Upgrade Probe","employer":"CI Corp","jobUrl":"https://example.com/jobs/ci","jobDescription":"Survive the upgrade."}}' \
            | jq -e '.ok == true' >/dev/null

          # A clean stop lets SQLite checkpoint its WAL into jobs.db.
          docker stop jo-base

      - name: This branch's image migrates the volume and keeps the job
        run: |
          set -eu
          docker run -d --name jo -p 3001:3001 -v jo-data:/app/data \
            --env-file "$RUNNER_TEMP/jo.env" job-ops:ci
          for i in $(seq 1 90); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'

          echo "state lives on the volume, under DATA_DIR"
          docker exec jo test -s /app/data/jobs.db

          echo "the admin seeded by the previous image can still sign in"
          token="$(curl -fsS -X POST http://localhost:3001/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"ci","password":"ci-password-123"}' | jq -er .data.token)"

          echo "the job stored before the upgrade is still there"
          curl -fsS http://localhost:3001/api/jobs -H "authorization: Bearer $token" \
            | jq -e '[.data.jobs[].title] | index("CI Upgrade Probe") != null' >/dev/null

          echo "the API stays closed without a token"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/jobs)" = 401 ]

          echo "the UI is served"
          curl -fsS -o /dev/null -w '%{content_type}' http://localhost:3001/ | grep -q '^text/html'

      - name: Logs on failure
        if: failure()
        run: |
          docker logs jo-base || true
          docker logs jo || true
