# Builds the Job Ops image on every PR and on main, then boots it and waits for
# /health. The image is the upstream release pinned in the Dockerfile, so what
# this catches is a tag that no longer exists or an image that no longer starts
# without configuration — the app must come up with no variables set.
name: docker-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build job-ops
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: job-ops:ci
          cache-from: type=gha,scope=job-ops
          cache-to: type=gha,mode=max,scope=job-ops

      - name: Boots and answers /health with no configuration
        run: |
          docker run -d --name jo -p 3001:3001 job-ops:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:3001/health | grep -q '"status":"ok"'

      - name: Logs on failure
        if: failure()
        run: docker logs jo || true
